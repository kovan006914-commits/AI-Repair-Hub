spring:
  application.name: AI-Repair-Hub
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ai_repair_hub?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USER:repair_app}
    password: ${DB_PASSWORD:}
  servlet.multipart.max-file-size: 3MB
  servlet.multipart.max-request-size: 4MB
  jackson.time-zone: Asia/Shanghai
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
app:
  upload-dir: ${UPLOAD_DIR:./uploads}
  jwt-secret: ${JWT_SECRET:}
  admin-username: ${ADMIN_USERNAME:}
  admin-password: ${ADMIN_PASSWORD:}
server.error.include-message: never
